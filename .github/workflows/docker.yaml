name: Docker Image Sync to Aliyun

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'images.txt'

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  # 可选：配置 Docker Hub 账号，避免匿名拉取被限流
  DOCKERHUB_USER: "${{ secrets.DOCKERHUB_USER }}"
  DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"
  WEBHOOK_URL: "${{ secrets.WEBHOOK_URL }}" # 在 Secrets 中配置飞书或企微地址

jobs:
  build:
    name: Sync Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 不再需要 Maximize build space / Restart docker：
      # skopeo 在仓库之间直接复制，不经过本地 Docker 存储，几乎不占磁盘

      - name: Sync and Push to Aliyun
        id: sync_step
        run: |
          SYNC_SUMMARY=""
          SUCCESS_COUNT=0
          FAILURE_COUNT=0

          # 源仓库凭据（可选）
          SRC_CREDS=()
          if [[ -n "$DOCKERHUB_USER" && -n "$DOCKERHUB_TOKEN" ]]; then
              SRC_CREDS=(--src-creds "$DOCKERHUB_USER:$DOCKERHUB_TOKEN")
          fi

          while IFS= read -r line || [ -n "$line" ]; do
              [[ -z "${line// }" ]] && continue
              [[ "$line" =~ ^[[:space:]]*# ]] && continue

              # 支持写法：--platform=linux/arm64 nginx:1.27
              # 不写平台时默认 linux/amd64
              arch="amd64"
              if [[ "$line" =~ --platform=([^[:space:]]+) ]]; then
                  arch="${BASH_REMATCH[1]##*/}"
              fi

              raw_image=$(echo "$line" | awk '{print $NF}')
              full_image="${raw_image%%@*}"
              image_name_tag=$(echo "$full_image" | awk -F'/' '{print $NF}')

              # 去掉 Docker Hub 的默认前缀，官方镜像（node、nginx、elasticsearch）不加任何前缀
              #   node:18-alpine                -> node:18-alpine
              #   openmetadata/server:2.0.1     -> openmetadata_server:2.0.1
              path="${full_image#docker.io/}"
              path="${path#library/}"
              if [[ "$path" == *"/"* ]]; then
                  org_part=$(echo "$path" | sed "s|\/${image_name_tag}||" | tr '/' '_')
                  repo_base="${org_part}_${image_name_tag}"
              else
                  repo_base="${image_name_tag}"
              fi

              # 非 amd64 的镜像在名字里加上架构后缀，避免和 amd64 版本互相覆盖
              suffix=""
              [[ "$arch" != "amd64" ]] && suffix="-${arch}"

              new_repo_name="${repo_base}${suffix}"
              target_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$new_repo_name"

              # 目标已存在则跳过
              if skopeo inspect --creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" \
                   "docker://$target_image" > /dev/null 2>&1; then
                  echo ">>> Skip: $new_repo_name"
                  continue
              fi

              echo ">>> Copy: $full_image ($arch) -> $new_repo_name"
              # 仓库到仓库直接复制，不解压、不落 Docker 存储
              if skopeo copy --retry-times 3 \
                   --override-os linux --override-arch "$arch" \
                   "${SRC_CREDS[@]}" \
                   --dest-creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" \
                   "docker://$full_image" "docker://$target_image"; then
                  SYNC_SUMMARY="${SYNC_SUMMARY}\n✨ ${new_repo_name}"
                  SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              else
                  SYNC_SUMMARY="${SYNC_SUMMARY}\n🚨 ${new_repo_name} (推送失败)"
                  FAILURE_COUNT=$((FAILURE_COUNT + 1))
              fi
          done < images.txt

          echo "SUCCESS_COUNT=$SUCCESS_COUNT" >> $GITHUB_ENV
          echo "FAILURE_COUNT=$FAILURE_COUNT" >> $GITHUB_ENV
          {
            echo 'SYNC_RESULT<<EOF'
            echo -e "$SYNC_SUMMARY"
            echo 'EOF'
          } >> $GITHUB_ENV

          # 有失败时让这次运行显示为失败，方便在 Actions 列表里一眼看到
          [[ "$FAILURE_COUNT" -eq 0 ]]

      - name: 发送 Webhook 通知
        if: always()
        run: |
          if [ -z "$WEBHOOK_URL" ]; then exit 0; fi

          # 上一步中途出错时这两个变量可能为空，给默认值
          S_COUNT=${{ env.SUCCESS_COUNT || 0 }}
          F_COUNT=${{ env.FAILURE_COUNT || 0 }}

          if [ "$F_COUNT" -gt 0 ] || [ "${{ steps.sync_step.outcome }}" = "failure" ]; then
              TITLE="❌ 阿里云镜像同步失败"
              CONTENT="⚠️ 警告：有 $F_COUNT 个镜像同步出现异常，请及时检查。"
          elif [ "$S_COUNT" -gt 0 ]; then
              TITLE="✅ 阿里云镜像同步成功"
              CONTENT="本次新增同步镜像如下："
          else
              TITLE="☕ 同步任务完成 (无新镜像)"
              CONTENT="检测到 images.txt 中暂无新镜像需要同步。"
          fi

          RAW_TEXT=$(cat <<EOF
          $TITLE
          ━━━━━━━━━━━━━━━━
          $CONTENT
          ${{ env.SYNC_RESULT }}

          📊 统计: 成功 $S_COUNT | 失败 $F_COUNT
          🔗 详情: [查看 GitHub Action 日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
          )

          JSON_PAYLOAD=$(jq -n --arg msg "$RAW_TEXT" '{"msg_type":"text","content":{"text":$msg}}')
          curl -sS -X POST -H "Content-Type: application/json" -d "$JSON_PAYLOAD" "$WEBHOOK_URL"
